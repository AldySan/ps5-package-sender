name: build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          windeployqt --release --qmldir qml build/bin/Release/ps5-package-sender.exe
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)' |
                      Select-Object -First 1).Matches.Groups[1].Value
          $stage = "stage/ps5-package-sender-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/bin/Release/* $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "ps5-package-sender-$version-windows-x64.zip"

      - name: Deploy portable (Linux)
        if: runner.os == 'Linux'
        run: |
          version=$(grep -m1 -oP 'VERSION \K\d+\.\d+\.\d+' CMakeLists.txt)
          scripts/deploy-linux.sh build dist
          mv "dist/ps5-package-sender-linux-x64" "dist/ps5-package-sender-$version-linux-x64"
          tar -C dist -czf "ps5-package-sender-$version-linux-x64.tar.gz" "ps5-package-sender-$version-linux-x64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: |
            ps5-package-sender-*-windows-x64.zip
            ps5-package-sender-*-linux-x64.tar.gz
          if-no-files-found: ignore
